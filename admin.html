<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Logo Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <a class="back" href="index.html">← Back to Gallery</a>
    <section class="panel">
      <div id="login-view">
        <h1>Admin Login</h1>
        <p class="muted">Logo upload करने के लिए admin account से login करें।</p>
        <form id="login-form">
          <label>Email
            <input id="email" type="email" required autocomplete="email">
          </label>
          <label>Password
            <input id="password" type="password" required autocomplete="current-password">
          </label>
          <button class="btn primary full" type="submit">Login</button>
          <div id="login-msg" class="message hidden"></div>
        </form>
      </div>

      <div id="dashboard" class="hidden">
        <div class="dash-head">
          <div>
            <h1>Upload Logo</h1>
            <p id="admin-email" class="muted"></p>
          </div>
          <button id="logout" class="btn ghost">Logout</button>
        </div>

        <form id="upload-form">
          <label>Logo name
            <input id="logo-name" type="text" maxlength="100" required placeholder="Example: NSS Logo">
          </label>
          <label>Short description
            <textarea id="logo-description" maxlength="500" rows="4" placeholder="Logo के बारे में छोटी जानकारी"></textarea>
          </label>
          <label>Logo file
            <input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" required>
          </label>
          <p class="hint">Recommended: PNG/WebP/JPG/SVG. Maximum size: 5 MB.</p>
          <button class="btn primary full" type="submit">Upload Logo</button>
          <div id="upload-msg" class="message hidden"></div>
        </form>

        <hr>
        <h2>Your uploaded logos</h2>
        <div id="admin-grid" class="admin-grid"></div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
